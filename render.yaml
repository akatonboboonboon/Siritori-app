services:
  - type: web
    name: siritori-app
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.start
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: NICEGUI_STORAGE_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true